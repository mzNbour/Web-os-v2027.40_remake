name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # mainブランチにプッシュされたら起動
  workflow_dispatch: # GitHub Actions画面から手動実行も可能にする

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Viteのビルド出力フォルダ
          branch: gh-pages # 公開用ブランチ
